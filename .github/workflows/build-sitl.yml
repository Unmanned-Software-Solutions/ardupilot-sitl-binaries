name: Build SITL

# Builds ArduPilot SITL for one (vehicle, version) across all supported platforms
# and publishes the assets as a GitHub Release.
#
# Triggered:
#   - manually via workflow_dispatch (for backfilling old versions)
#   - by discover-versions.yml when a new upstream tag is detected

on:
  workflow_dispatch:
    inputs:
      ardupilot_tag:
        description: "ArduPilot upstream tag (e.g. Copter-4.6.3, ArduSub-4.5.7)"
        required: true
      vehicle:
        description: "Vehicle key (copter|plane|rover|tracker|sub)"
        required: true
      version:
        description: "Semantic version (e.g. 4.6.3) — must match the suffix of ardupilot_tag"
        required: true
  workflow_call:
    inputs:
      ardupilot_tag:
        required: true
        type: string
      vehicle:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,        platform: linux-x64,   ext: tar.gz }
          - { os: ubuntu-22.04-arm,    platform: linux-arm64, ext: tar.gz }
          - { os: macos-13,            platform: macos-x64,   ext: tar.gz }
          - { os: macos-14,            platform: macos-arm64, ext: tar.gz }
          - { os: windows-2022,        platform: windows-x64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout ArduPilot at ${{ inputs.ardupilot_tag }}
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: ${{ inputs.ardupilot_tag }}
          path: ardupilot
          submodules: recursive

      - name: Install build deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev python3-numpy \
            python3-pexpect python3-future python3-empy ccache \
            gawk build-essential libtool libxml2-dev libxslt-dev
          cd ardupilot && Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ccache wget
          pip3 install --break-system-packages pyserial pymavlink future lxml empy

      - name: Install build deps (Windows / Cygwin)
        if: startsWith(matrix.os, 'windows')
        # ArduPilot's Windows SITL build path is Cygwin — see ArduPilot's own
        # Tools/scripts/build_ci.sh for the canonical script that Mission Planner uses.
        run: |
          choco install -y cygwin cyg-get
          cyg-get python3 python3-future python3-lxml git gcc-g++ make ccache libtool autoconf automake
          # Further wiring (PATH, GCC selection, etc.) goes here — placeholder until validated.
        shell: pwsh

      - name: Build SITL
        shell: bash
        run: bash scripts/build_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}"

      - name: Package archive
        shell: bash
        run: bash scripts/package_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}" "${{ matrix.ext }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ardupilot_tag }}
          name: ${{ inputs.ardupilot_tag }}
          files: |
            dist/ardupilot-sitl-${{ inputs.ardupilot_tag }}-${{ matrix.platform }}.${{ matrix.ext }}
            dist/ardupilot-sitl-${{ inputs.ardupilot_tag }}-${{ matrix.platform }}.${{ matrix.ext }}.sha256

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Regenerate manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_manifest.py
      - name: Commit manifest update
        run: |
          git config user.name "sitl-binaries-bot"
          git config user.email "sitl-binaries-bot@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest after ${{ inputs.ardupilot_tag }}" || echo "no changes"
          git push
