name: Build SITL

# Builds ArduPilot SITL for one (vehicle, version) across all supported platforms
# and publishes the assets as a GitHub Release.
#
# Triggered:
#   - manually via workflow_dispatch (for backfilling old versions)
#   - by discover-versions.yml when a new upstream tag is detected

on:
  workflow_dispatch:
    inputs:
      ardupilot_tag:
        description: "ArduPilot upstream tag (e.g. Copter-4.6.3, ArduSub-4.5.7)"
        required: true
      vehicle:
        description: "Vehicle key (copter|plane|rover|tracker|sub)"
        required: true
      version:
        description: "Semantic version (e.g. 4.6.3) — must match the suffix of ardupilot_tag"
        required: true
  workflow_call:
    inputs:
      ardupilot_tag:
        required: true
        type: string
      vehicle:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,        platform: linux-x64,   ext: tar.gz, continue: false }
          - { os: ubuntu-22.04-arm,    platform: linux-arm64, ext: tar.gz, continue: false }
          - { os: macos-14,            platform: macos-arm64, ext: tar.gz, continue: false }
          # macos-13 (Intel) runners are scarce — queue times routinely exceed 30 min,
          # which gates manifest publication for everyone else. Keep it in the matrix
          # so we build when a runner is available, but don't let it block.
          - { os: macos-13,            platform: macos-x64,   ext: tar.gz, continue: true  }
          # Windows builds under Cygwin (see the Windows steps below). Kept
          # non-blocking until the first green backfill run confirms the toolchain;
          # flip `continue` to false once validated so regressions surface.
          - { os: windows-2022,        platform: windows-x64, ext: zip,    continue: true  }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue }}
    steps:
      - name: Skip if asset already published
        # Cheap check up front: if the release tag already has our asset, mark this
        # job as "already done" and skip every subsequent step. Saves the bulk of CI
        # minutes on retry runs where most platforms succeeded on a previous attempt.
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          asset="ardupilot-sitl-${{ inputs.ardupilot_tag }}-${{ matrix.platform }}.${{ matrix.ext }}"
          if gh release view "${{ inputs.ardupilot_tag }}" \
               --repo "${GITHUB_REPOSITORY}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
            echo "asset $asset already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "asset $asset not yet published — will build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable long paths (Windows)
        if: startsWith(matrix.os, 'windows') && steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true

      - name: Checkout this repo
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Checkout ArduPilot at ${{ inputs.ardupilot_tag }}
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: ${{ inputs.ardupilot_tag }}
          path: ardupilot
          submodules: recursive

      - name: Install build deps (Linux)
        if: startsWith(matrix.os, 'ubuntu') && steps.skip.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev python3-numpy \
            python3-pexpect python3-future python3-empy ccache \
            gawk build-essential libtool libxml2-dev libxslt-dev
          cd ardupilot && Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos') && steps.skip.outputs.skip != 'true'
        # empy is pinned to 3.3.4: ArduPilot's dronecan generator uses the old `@)`
        # markup that was removed in empy 4.x, so picking up the current pip default
        # breaks the build with `unknown markup sequence: '@)'`. pexpect must be
        # present because waf imports it during the bin-embed step. Ubuntu's apt
        # ships a compatible empy as python3-empy so the Linux path is unaffected.
        run: |
          brew install ccache wget
          pip3 install --break-system-packages \
            pyserial pymavlink future lxml 'empy==3.3.4' pexpect fastcrc dronecan

      - name: Install build deps (Windows / Cygwin)
        if: startsWith(matrix.os, 'windows') && steps.skip.outputs.skip != 'true'
        # ArduPilot's Windows SITL build path is Cygwin — this mirrors the package
        # set and gcc pin from ArduPilot's own .github/workflows/cygwin_build.yml,
        # the workflow that produces the Mission Planner SITL exes. add-to-path is
        # left off so the Cygwin toolchain doesn't shadow the runner's native git.
        uses: cygwin/cygwin-install-action@v5
        with:
          packages: >-
            cygwin64 gcc-g++=10.2.0-1 python37 python37-future python37-lxml
            python37-pip python37-setuptools python37-wheel git procps gettext
            zip unzip
          add-to-path: false

      - name: Prepare Cygwin Python (Windows)
        if: startsWith(matrix.os, 'windows') && steps.skip.outputs.skip != 'true'
        # python37 is the highest Cygwin python ArduPilot validates against. empy is
        # pinned to 3.3.4 (4.x dropped the `@)` markup the dronecan generator uses)
        # and pexpect is imported by waf's bin-embed step — same pins as the Linux
        # and macOS legs above.
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH="/usr/bin:$(cygpath "${SYSTEMROOT}")/system32"
          ln -sf /usr/bin/python3.7 /usr/bin/python
          ln -sf /usr/bin/pip3.7 /usr/bin/pip
          python -m pip install --progress-bar off 'empy==3.3.4' pexpect
          python -m pip install --progress-bar off dronecan --upgrade

      - name: Build & package SITL (Unix)
        if: ${{ steps.skip.outputs.skip != 'true' && !startsWith(matrix.os, 'windows') }}
        shell: bash
        run: |
          bash scripts/build_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}"
          bash scripts/package_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}" "${{ matrix.ext }}"

      - name: Build & package SITL (Windows / Cygwin)
        if: ${{ steps.skip.outputs.skip != 'true' && startsWith(matrix.os, 'windows') }}
        # Must run under Cygwin's bash (not the runner's Git bash) so waf picks up the
        # cygwin python/g++ toolchain. safe.directory is needed because the tree was
        # checked out by the runner's native git but is now read by Cygwin git.
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH="/usr/local/bin:/usr/bin:$(cygpath "${SYSTEMROOT}")/system32"
          ws="$(cygpath -u "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$ws"
          git config --global --add safe.directory "$ws/ardupilot"
          cd "$ws"
          bash scripts/build_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}"
          bash scripts/package_one.sh "${{ inputs.vehicle }}" "${{ inputs.ardupilot_tag }}" "${{ matrix.platform }}" "${{ matrix.ext }}"

      - name: Upload to GitHub Release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ardupilot_tag }}
          name: ${{ inputs.ardupilot_tag }}
          files: |
            dist/ardupilot-sitl-${{ inputs.ardupilot_tag }}-${{ matrix.platform }}.${{ matrix.ext }}
            dist/ardupilot-sitl-${{ inputs.ardupilot_tag }}-${{ matrix.platform }}.${{ matrix.ext }}.sha256

# Manifest regeneration is its own workflow (`update-manifest.yml`) triggered on
# `release: published`. Decoupling avoids waiting on slow runners (macos-13 and the
# Cygwin windows leg both queue/build slowly) to publish the manifest for the rest.
